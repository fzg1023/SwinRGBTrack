# ══════════════════════════════════════════════════════════════════════════════
# RGBTSwinTrack 训练运行配置
# ══════════════════════════════════════════════════════════════════════════════

version: 4

num_epochs: 300

branch:
  train:
    training: true
    data: "train"
    runner: "train"
    logging:
      display_name: "Train"
      interval: 10
      local:
        header: "Epoch: [{epoch}]"
      wandb:
        with_epoch: true

  val:
    training: false
    data: "val"
    runner: "train"
    epoch_interval: 1
    logging:
      interval: 10
      metric_prefix: "val_"
      local:
        header: "Val"
        epoch_summary:
          enabled: true
          method: "mean"
      wandb:
        per_iteration_logging:
          enabled: false
        per_epoch_logging:
          enabled: true
          summary_method: "mean"

  test:
    training: false
    data: "test"
    runner: "test"
    epoch_interval: -1
    logging:
      interval: 10
      metric_prefix: "test_"
      local:
        header: "Test"
    metrics:
      enabled: true
      output_path: "test_metrics"
      handler:
        - type: "test_only"
          name_regex: "got-10k-test"
          packer:
            path: "got10k"
            format: "got10k"
        - type: "test_only"
          name_regex: "trackingnet-test"
          packer:
            path: "trackingnet"
            format: "trackingnet"
        - type: "standard"
    tracking:
      type: "SiamFC"
      curation_parameter_provider:
        type: "simple"
        min_object_size: [ 10, 10 ]
      window_penalty: 0.49
      cache:
        template:
          type: "token"
          dim: 512
          length: 144    # 12 * 12
        image_mean:
          type: "scalar"
          dim: 3

data:
  train:
    batch_size: 32        # RGBT双模态，batch_size减半以适配显存

    type: "SiamFC"

    source:
      !include "../../dataset/train.yaml"

    sampler:
      samples_per_epoch: 131072
      negative_sample_ratio: 0

      dataset_sampling:
        type: "random_without_replacement"

      sequence_sampling:
        type: "Siamese"
        parameters:
          frame_range: 100
          enforce_fine_positive_sample: true
          enable_adaptive_frame_range: true
          sampling_method: "interval"

      curation:
        template:
          area_factor: 2.0
          size: [ 192, 192 ]
        search:
          area_factor: 4.0
          size: [ 384, 384 ]

      transformation:
        template:
          color_jitter:
            brightness: 0.4
            contrast: 0.4
            saturation: 0.4
            hue: 0.1
            probability: 0.8
          grayscale:
            probability: 0.2
          blur:
            probability: 0.2
        search:
          color_jitter:
            brightness: 0.4
            contrast: 0.4
            saturation: 0.4
            hue: 0.1
            probability: 0.8
          grayscale:
            probability: 0.2
          blur:
            probability: 0.2

  val:
    batch_size: 64
    type: "SiamFC"

    source:
      !include "../../dataset/train.yaml"

    sampler:
      samples_per_epoch: 2048
      seed: 0

      dataset_sampling:
        type: "random"

      sequence_sampling:
        type: "Siamese"
        parameters:
          frame_range: 100
          sampling_method: "uniform"

      curation:
        template:
          area_factor: 2.0
          size: [ 192, 192 ]
        search:
          area_factor: 4.0
          size: [ 384, 384 ]

      transformation:
        template: {}
        search: {}

  test:
    batch_size: 1
    type: "Sequential"
    source: {}
    pivot:
      name: "dataset"
