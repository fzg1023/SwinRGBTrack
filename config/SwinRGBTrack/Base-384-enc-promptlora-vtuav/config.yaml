name: "RGBTSwinTrack-Base-384-EncPromptLoRA-VTUAV"

version: 1

logging:
  category: "RGBTSwinTrack"
  tags: ["Swin-Transformer", "RGBT", "EncPromptLoRA", "VTUAV"]

type: "RGBTSwinTrackEncPromptLoRA"

data:
  template_size: [ 192, 192 ]
  search_size: [ 384, 384 ]
  imagenet_normalization: true
  interpolation_mode: "bilinear"
  bounding_box:
    format: "CXCYWH"
    normalization_protocol:
      interval: "[)"
      range: [ 0, 1 ]

backbone:
  type: "swin_transformer"
  parameters:
    name: "swin_base_patch4_window12_384_in22k"
    output_layers: [ 2 ]

transformer:
  position_embedding:
    enabled: false
    type: "sine"
    with_branch_index: true
  untied_position_embedding:
    absolute:
      enabled: true
    relative:
      enabled: true
  drop_path:
    rate: 0.1
    warmup:
      initial_factor: 0
      length: 0.5
      method: "constant"
      per_iteration: true
  dim: 512
  backbone:
    dim: 512
    stage: 2
    template:
      shape: [ 12, 12 ]
    search:
      shape: [ 24, 24 ]
  num_heads: 8
  mlp_ratio: 4
  qkv_bias: true
  drop_rate: 0
  attn_drop_rate: 0
  encoder:
    type: "concatenation_feature_fusion"
    num_layers: 8
  decoder:
    type: "concatenation_feature_fusion"
    num_layers: 1

# Encoder 内逐层跨模态 prompt (加性低秩) + TIR 专属 LoRA 旁路参数
# prompt/LoRA 均零初始化, 初始行为与 EncFuseMamba 严格一致
prompt_lora:
  prompt_r: 16     # PromptGen 瓶颈维度 (2*dim*r ≈ 16K/层/方向)
  lora_r: 8        # LoRA 秩 (2*dim*r ≈ 8K/Linear)
  lora_alpha: 16   # LoRA scale = alpha / r

head:
  output_protocol:
    type: "ResponseMap"
    parameters:
      label:
        size: [ 24, 24 ]
  type: "Mlp"
  parameters:
    dim: 512

runs: !include "runs.yaml"
